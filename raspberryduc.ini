# RaspberryDuc configuration
# Copy or edit this file next to run.py (or set RASPBERRYDUC_CONFIG).

[logging]
# When true, every command sent to the ELM327 and every response from the
# adapter / ECU is written to a new session log (R20).
enabled = true
# Directory for session logs. Files are named raspberryduc_YYYY_DD_MM_HH_MM_SS.log
# A new file is created on each start; at most 5 files are kept (R20.1–R20.4).
directory = logs
